# CodeQL 静态安全扫描（Java）：push main、PR、每周一次。结果进仓库 Security → Code scanning。
# build-mode manual：用与 ci.yml 相同的 JDK 21 + ./mvnw（Maven 3.9.12）编译，CodeQL 跟踪这次编译抽取代码；
# 只编译不跑测试（-DskipTests 仍编译测试代码），rpc-integration-tests 排除出 reactor（与 release.yml 同一个 -pl 写法；它只有测试代码）。
# actions 按 commit SHA 固定，行尾注释是对应 tag（见 ci.yml 顶部说明）。
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:27 UTC
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  MVN_FLAGS: -B -ntp

jobs:
  analyze:
    name: analyze (java-kotlin, manual build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # 上传 SARIF 到 Code scanning
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build (./mvnw install, no tests)
        run: ./mvnw $MVN_FLAGS -DskipTests -Djacoco.skip=true -pl '!rpc-integration-tests' install
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:java-kotlin
