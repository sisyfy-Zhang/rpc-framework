# 阶段 0 的 CI：每次 push / PR 跑全量构建与三项专门检查。
# 只做相对正确性检查，不产出任何性能数字（压测数字只来自固定本机，见 README 路线图）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # -B 非交互、-ntp 关掉下载进度日志（不用 MAVEN_ARGS 这个名字：Maven 3.9 会自动读取它，显式再传一遍会重复）
  MVN_FLAGS: -B -ntp
# 所有构建都走 ./mvnw：Maven 版本由 .mvn/wrapper/maven-wrapper.properties 固定（3.9.12，与本机 / WSL 压测机一致），
# 不随 runner 镜像升级漂移（镜像 20261018 把 Maven 换成 3.10 / resolver 2，见 pitfalls 第 37 条）
# 所有 actions 按 commit SHA 固定（行尾注释是对应 tag；OpenSSF Scorecard 的 Pinned-Dependencies 检查）。
# 升级时用 gh api repos/<owner>/<repo>/git/ref/tags/<tag> 查新 SHA（注解 tag 再解一层到 commit），ci / release / codeql / scorecard 四个文件一起改。

jobs:
  verify:
    name: verify (JDK 21, Linux, full build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker info (Nacos contract tests run only when Docker is available)
        run: docker version
      # 全量：单元 + 集成 + ArchUnit + Registry TCK（Nacos 经 Testcontainers 实跑）+ JaCoCo check（rpc-core ≥ 70%）
      - name: ./mvnw clean install
        run: ./mvnw $MVN_FLAGS clean install
      - name: Nacos contract tests must have run on this runner (only the known capability skip allowed)
        run: |
          report=rpc-registry-nacos/target/surefire-reports/TEST-com.feynman.rpc.registry.nacos.NacosRegistryContractTest.xml
          test -f "$report"
          suite=$(grep -o '<testsuite [^>]*' "$report" | head -1)
          echo "$suite"
          tests=$(echo "$suite" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*')
          failures=$(echo "$suite" | grep -o ' failures="[0-9]*"' | grep -o '[0-9]*')
          errors=$(echo "$suite" | grep -o ' errors="[0-9]*"' | grep -o '[0-9]*')
          skipped=$(echo "$suite" | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]*')
          [ "${tests:-0}" -ge 14 ] || { echo "::error::expected at least 14 Nacos contract tests, got ${tests:-0}"; exit 1; }
          [ "$failures" = 0 ] && [ "$errors" = 0 ] || { echo "::error::Nacos contract tests failed"; exit 1; }
          # 唯一允许跳过的是 TCK 的线程泄漏检查（能力假设：Nacos 客户端不由实现控制线程名）；其它任何跳过都视为门禁失败
          [ "${skipped:-0}" -le 1 ] || { echo "::error::more than one Nacos contract test skipped"; exit 1; }
          if [ "${skipped:-0}" = 1 ]; then
            grep -B1 '<skipped' "$report" | grep -q 'name="threadsCreatedByTheImplementationEndWithinFiveSecondsAfterClose"' \
              || { echo "::error::an unexpected Nacos contract test was skipped"; exit 1; }
          fi
          echo "Nacos contract tests ran: tests=$tests skipped=$skipped (only the known capability skip)"
      # Codecov 只上传 rpc-integration-tests 的 JaCoCo 聚合报告（全部模块测试的 exec 合并后，对 core / 注册中心 / 序列化 / starter / metrics / examples 各模块的覆盖），disable_search 不再自动搜各模块的 jacoco.xml，避免重复计数。
      # 先核对报告存在：聚合报告路径变了要在这里看见，而不是变成 Codecov 上静默的"无数据"。
      - name: JaCoCo aggregate XML exists
        run: ls -l rpc-integration-tests/target/site/jacoco-aggregate/jacoco.xml
      # CODECOV_TOKEN 未设置（或 fork 的 PR 拿不到 secret）时上传失败只记日志，不让 CI 变红
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rpc-integration-tests/target/site/jacoco-aggregate/jacoco.xml
          disable_search: true
          fail_ci_if_error: false
      - name: Upload test reports and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-reports
          path: |
            **/target/surefire-reports/
            rpc-core/target/site/jacoco/
            rpc-integration-tests/target/site/jacoco-aggregate/
          if-no-files-found: ignore

  sigterm:
    name: sigterm (real SIGTERM against a provider JVM, Linux only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and install all modules (no tests)
        run: ./mvnw $MVN_FLAGS install -DskipTests -Djacoco.skip=true
      # SigtermShutdownTest：独立 JVM 起 rpc-examples 的 provider，连测试进程里的 ZooKeeper（curator TestingServer），
      # 慢调用进行中 kill -TERM，断言：慢调用正常返回、节点先于它消失、进程在 shutdown-timeout 内以 143 退出。
      # 本机（Windows）上该用例被 @EnabledOnOs(LINUX) 跳过。
      - name: Run SigtermShutdownTest
        run: >
          ./mvnw $MVN_FLAGS -pl rpc-integration-tests verify -Djacoco.skip=true
          -Dtest=SigtermShutdownTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: The SIGTERM test must have run (not skipped)
        run: |
          report=rpc-integration-tests/target/surefire-reports/TEST-com.feynman.rpc.it.SigtermShutdownTest.xml
          test -f "$report"
          grep -q 'tests="1"' "$report" && grep -q 'skipped="0"' "$report" && grep -q 'failures="0"' "$report" && grep -q 'errors="0"' "$report"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigterm-reports
          path: rpc-integration-tests/target/surefire-reports/
          if-no-files-found: ignore

  paranoid-leak:
    name: paranoid-leak (Netty ByteBuf leak detection)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 每次分配都记录访问轨迹，未释放的 ByteBuf 被 GC 时打印 "LEAK:"（logback / slf4j 输出到控制台）
      - name: ./mvnw clean install with paranoid leak detection
        run: |
          set -o pipefail
          ./mvnw $MVN_FLAGS clean install -Djacoco.skip=true \
            "-DargLine=-Dio.netty.leakDetection.level=paranoid" 2>&1 | tee build.log
      - name: Leak detection was really on
        run: grep -q "ResourceLeakDetector level = PARANOID" build.log
      - name: No LEAK reports
        run: |
          if grep -n "LEAK:" build.log; then echo "::error::Netty reported ByteBuf leaks"; exit 1; fi
          if grep -rln "LEAK:" --include='*.txt' --include='*.xml' . ; then echo "::error::Netty reported ByteBuf leaks"; exit 1; fi
          echo "no LEAK reports"

  jdk25:
    name: jdk25 (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: ./mvnw clean install on JDK ${{ matrix.java }}
        run: ./mvnw $MVN_FLAGS clean install
