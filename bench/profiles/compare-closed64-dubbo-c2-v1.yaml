# 口径卡（对比对象，连接数对齐）：Dubbo 3（triple），同机 loopback、1KB、单提供者，闭环 64 并发，直连（--direct），到提供者 2 条连接。
# 与 compare-closed64-dubbo-v1（开箱即用：缺省一条连接）只差 target.connections：target.connections = 独立的 Dubbo 客户端实例数（各一条 triple 连接；reference 的 connections 参数被 triple 忽略，实测）。
# 2 = 本框架 rpc 卡的缺省（RpcClientConfig.connectionsPerNode = 2），与 compare-closed64-rpc-v1 连接数对齐。
# 单连接的上限是结构性的（两端各只有一个事件循环线程在干活），"开箱即用"与"连接数对齐"两组数字并列才完整，见 docs/benchmarking.md「对比对象」。
# 改动口径请复制成新 id（-v2），不要原地改。
profile: compare-closed64-dubbo-c2-v1
question: 同机 loopback、1KB、单提供者、直连，Dubbo 3（triple 协议） 闭环 64 并发下的吞吐与延迟量级（连接数对齐：2 条连接）
target:
  transport: dubbo
  service: BenchService#echo
  payload: { kind: bytes, size: 1024 }
  serializer: hessian2
  providers: 1
  connections: 2
load:
  model: closed
  concurrency: 64
  duration: 60s
  warmup: 20s
  steady_window: [20s, 55s]
  rounds: 3
  timeout: 1s
isolation:
  client_process: separate_jvm
  server_process: separate_jvm
  same_host: true
  registry: none (--direct)
measure:
  histogram: { significant_digits: 3, max: 10s }
  report: [throughput, p50, p95, p99, p999, max, errors_by_status]
assert:
  errors_max: 0
