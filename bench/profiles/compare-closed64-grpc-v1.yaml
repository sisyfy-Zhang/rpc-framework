# 口径卡（对比对象）：gRPC（grpc-java，Netty 传输，HTTP/2），同机 loopback、1KB、单提供者，闭环 64 并发，直连（--direct，不经注册中心）。
# 与 compare-closed64-rpc-v1, compare-closed64-dubbo-v1 只差 target.transport / serializer / question：
# 基础性能对比排除注册中心变量。serializer = protobuf：gRPC 的生成消息（message Bytes { bytes payload = 1; }），由提供者声明。
# 连接模型、线程与执行器的对等性说明见 docs/benchmarking.md「对比对象」；跑法：bench/bin/compare.sh。
# 改动口径请复制成新 id（-v2），不要原地改。
profile: compare-closed64-grpc-v1
question: 同机 loopback、1KB、单提供者、直连，gRPC（grpc-java，Netty 传输，HTTP/2） 闭环 64 并发下的吞吐与延迟量级
target:
  transport: grpc
  service: BenchService#echo
  payload: { kind: bytes, size: 1024 }
  serializer: protobuf
  providers: 1
load:
  model: closed
  concurrency: 64
  duration: 60s
  warmup: 20s
  steady_window: [20s, 55s]
  rounds: 3
  timeout: 1s
isolation:
  client_process: separate_jvm
  server_process: separate_jvm
  same_host: true
  registry: none (--direct)
measure:
  histogram: { significant_digits: 3, max: 10s }
  report: [throughput, p50, p95, p99, p999, max, errors_by_status]
assert:
  errors_max: 0
