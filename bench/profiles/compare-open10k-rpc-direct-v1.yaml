# 口径卡（执行器对照，非缺省配置）：本框架，同机 loopback、1KB、单提供者，开环 10000 req/s，直连（--direct），服务端业务执行器 direct
# （ExecutorConfig.direct()：业务方法在 IO 线程上执行，opt-in，不是缺省）。与 compare-open10k-rpc-v1 只差 target.server_executor：
# 与 gRPC --executor direct（directExecutor）同类的上界对照点。compare.sh 读 target.server_executor 给 bench server 传 --executor direct，
# 压测端核对服务端环境里的实际执行器（不符则判定不通过）。结果是"非缺省配置"的数字，与开箱即用的数字分开放、分开报。
# 跑法：bench/bin/compare.sh --transports rpc-direct --loads open10k。
# 改动口径请复制成新 id（-v2），不要原地改。
profile: compare-open10k-rpc-direct-v1
question: 同机 loopback、1KB、单提供者、直连，本框架 开环 10000 req/s 下的延迟分布（服务端执行器 direct，非缺省）
target:
  transport: rpc
  service: BenchService#echo
  payload: { kind: bytes, size: 1024 }
  serializer: protobuf
  providers: 1
  server_executor: direct
load:
  model: open
  rate: 10000
  duration: 60s
  warmup: 20s
  steady_window: [20s, 55s]
  rounds: 3
  timeout: 1s
isolation:
  client_process: separate_jvm
  server_process: separate_jvm
  same_host: true
  registry: none (--direct)
measure:
  histogram: { significant_digits: 3, max: 10s }
  report: [throughput, p50, p95, p99, p999, max, errors_by_status]
assert:
  errors_max: 0
