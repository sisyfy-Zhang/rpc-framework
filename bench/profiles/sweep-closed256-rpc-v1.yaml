# 口径卡（并发扫描）：本框架，同机 loopback、1KB、单提供者，闭环 256 并发，直连（--direct，不经注册中心）。
# 与 compare-closed64-rpc-v1 只差 load.concurrency（64 并发的结果与它共用）：找吞吐不再随并发增长的点与此时两侧的 CPU。
# 跑法：bench/bin/sweep.sh。改动口径请复制成新 id（-v2），不要原地改。
profile: sweep-closed256-rpc-v1
question: 同机 loopback、1KB、单提供者、直连，本框架 闭环 256 并发下的吞吐与两侧 CPU（并发扫描）
target:
  transport: rpc
  service: BenchService#echo
  payload: { kind: bytes, size: 1024 }
  serializer: protobuf
  providers: 1
load:
  model: closed
  concurrency: 256
  duration: 60s
  warmup: 20s
  steady_window: [20s, 55s]
  rounds: 3
  timeout: 1s
isolation:
  client_process: separate_jvm
  server_process: separate_jvm
  same_host: true
  registry: none (--direct)
measure:
  histogram: { significant_digits: 3, max: 10s }
  report: [throughput, p50, p95, p99, p999, max, errors_by_status]
assert:
  errors_max: 0
