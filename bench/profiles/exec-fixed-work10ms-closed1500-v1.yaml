# 口径卡（执行器对照，非缺省配置：服务端业务方法带等待）：本框架，同机 loopback、1KB、单提供者，直连（--direct）。
# 拒绝边界：并发 1500 > 固定池 10 个线程 + 排队上限 1000，fixed 应出现 SERVER_OVERLOADED；排队约 1000 × 10ms / 10 = 1s，与超时 1s 同量级。
# 虚拟线程：上限是压测端 1500 / 10ms = 150k req/s，实际受压测端 CPU 限制（client_bound 如实标注）。与 exec-fixed-work10ms-closed256-v1 只差 load.concurrency。
# 成对的卡只在 target.server_executor 一处不同（fixed = 框架缺省 ExecutorConfig.defaults() / virtual = ExecutorConfig.virtualThreads()）；
# 压测端核对服务端环境的 server_executor_kind / server_work_ms / server_work_mode，不符判定不通过。错误（含 SERVER_OVERLOADED）按类型统计，不判无效。
# 跑法：bench/bin/sweep.sh --cards exec-fixed-work10ms-closed1500-v1（sweep.sh 按卡片给服务端传 --executor / --work / --work-mode）。见 docs/probes/executor-blocking.md。
# 改动口径请复制成新 id（-v2），不要原地改。
profile: exec-fixed-work10ms-closed1500-v1
question: 单提供者、直连、1KB，服务端业务方法每次 parkNanos 10ms（模拟 IO 等待），闭环 1500 并发：服务端执行器 fixed 的吞吐、延迟、拒绝数、每请求 CPU 与线程数
target:
  transport: rpc
  service: BenchService#echo
  payload: { kind: bytes, size: 1024 }
  serializer: protobuf
  providers: 1
  server_executor: fixed
  server_work: 10ms
load:
  model: closed
  concurrency: 1500
  duration: 60s
  warmup: 20s
  steady_window: [20s, 55s]
  rounds: 3
  timeout: 1s
isolation:
  client_process: separate_jvm
  server_process: separate_jvm
  same_host: true
  registry: none (--direct)
measure:
  histogram: { significant_digits: 3, max: 10s }
  report: [throughput, p50, p95, p99, p999, max, errors_by_status]
