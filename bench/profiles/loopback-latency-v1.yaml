# 口径卡：同机 loopback、1KB、单提供者，开环 10000 req/s——回答"给定负载下的延迟分布（含尾延迟）"。
# 开环按计划发出时刻计时（修正 coordinated omission），见 docs/benchmarking.md。
# 改动口径请复制成新 id（-v2），不要原地改。
profile: loopback-latency-v1
question: 同机 loopback、1KB、单提供者，开环 10000 req/s 下的延迟分布
target:
  transport: rpc
  service: BenchService#echo
  payload: { kind: bytes, size: 1024 }
  serializer: protobuf
  providers: 1
load:
  model: open
  rate: 10000
  duration: 60s
  warmup: 20s
  steady_window: [20s, 55s]
  rounds: 3
  timeout: 1s
isolation:
  client_process: separate_jvm
  server_process: separate_jvm
  same_host: true
  registry: docker-compose/zookeeper
measure:
  histogram: { significant_digits: 3, max: 10s }
  report: [throughput, p50, p95, p99, p999, max, errors_by_status]
assert:
  errors_max: 0
