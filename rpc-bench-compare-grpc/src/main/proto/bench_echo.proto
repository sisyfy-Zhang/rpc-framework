// 对比对象 gRPC 的服务契约：与 rpc-bench-e2e 的 BenchService 一一对应。
//   Echo        <-> BenchService#echo(byte[])：原样回显（1KB 负载时两边线上都是"一个 bytes 字段"）
//   Environment <-> BenchService#environment()：服务端启动时采集的环境（与 bench server 同一套字段，ServerProbes.environment()）
//   Stats       <-> BenchService#stats()：此刻的累计 GC 与堆用量（ServerProbes.gcStats()），压测端在统计窗口起止各取一次
syntax = "proto3";

package feynman.bench;

option java_package = "com.feynman.rpc.bench.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "BenchEchoProto";

service BenchEcho {
  rpc Echo(Bytes) returns (Bytes);
  rpc Environment(Empty) returns (Env);
  rpc Stats(Empty) returns (ServerStats);
}

message Bytes {
  bytes payload = 1;
}

// 不用 google.protobuf.Empty：不引入 well-known types 的导入路径，契约自包含
message Empty {
}

message Env {
  map<string, string> values = 1;
}

// 不能叫 Stats：与同一作用域里的 rpc Stats 重名，protoc 会把返回类型解析成方法而报错
message ServerStats {
  map<string, string> values = 1;
}
